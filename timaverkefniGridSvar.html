<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tímaverkefni í grid</title>
    <style>
      body {
        margin: 40px;
        font-family: Arial, sans-serif;
      }

      .wrapper {
        display: grid;
        grid-gap: 10px;
        background-color: #fff;
        color: #444;
        margin-bottom: 40px;
        padding: 20px;
        border: 2px solid #333;
      }

      .box {
        background-color: #444;
        color: #fff;
        border-radius: 5px;
        padding: 20px;
        font-size: 150%;
        text-align: center;
      }

      /* Example 1: Using grid-template-areas - Layout: A full width top, B and C side by side, D full width bottom */
      .wrapper1 {
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
        grid-template-areas:
          "a a a"
          "b b c"
          "d d d";
      }

      .wrapper1 .a {
        grid-area: a;
        background-color: #e74c3c;
      }
      .wrapper1 .b {
        grid-area: b;
        background-color: #3498db;
      }
      .wrapper1 .c {
        grid-area: c;
        background-color: #2ecc71;
      }
      .wrapper1 .d {
        grid-area: d;
        background-color: #f39c12;
      }

      /* Example 2: Using grid-column-start/end and grid-row-start/end - Layout: A left column, B/C/D stacked right */
      .wrapper2 {
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
      }

      .wrapper2 .a {
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 1;
        grid-row-end: 4;
        background-color: #9b59b6;
      }
      .wrapper2 .b {
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 1;
        grid-row-end: 2;
        background-color: #1abc9c;
      }
      .wrapper2 .c {
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 2;
        grid-row-end: 3;
        background-color: #e67e22;
      }
      .wrapper2 .d {
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 3;
        grid-row-end: 4;
        background-color: #34495e;
      }

      /* Example 3: Using grid-column and grid-row shorthand - Layout: A top-left 2x1, B top-right, C middle-left, D spans bottom 2 columns */
      .wrapper3 {
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
      }

      .wrapper3 .a {
        grid-column: 1 / 3;
        grid-row: 1 / 2;
        background-color: #16a085;
      }
      .wrapper3 .b {
        grid-column: 3 / 4;
        grid-row: 1 / 3;
        background-color: #c0392b;
      }
      .wrapper3 .c {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
        background-color: #d35400;
      }
      .wrapper3 .d {
        grid-column: 2 / 4;
        grid-row: 3 / 4;
        background-color: #8e44ad;
      }

      /* Example 4: Using grid-area shorthand - Layout: A center 2x2, B top-left, C top-right, D bottom-left */
      .wrapper4 {
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
      }

      .wrapper4 .a {
        grid-area: 2 / 2 / 4 / 4;
        background-color: #27ae60;
      }
      .wrapper4 .b {
        grid-area: 1 / 1 / 2 / 2;
        background-color: #2980b9;
      }
      .wrapper4 .c {
        grid-area: 1 / 3 / 2 / 4;
        background-color: #e74c3c;
      }
      .wrapper4 .d {
        grid-area: 3 / 1 / 4 / 2;
        background-color: #f1c40f;
        color: #333;
      }

      h2 {
        margin-top: 10px;
        margin-bottom: 30px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <!-- Example 1: Using grid-template-areas -->
    <div class="wrapper wrapper1">
      <div class="box a">A</div>
      <div class="box b">B</div>
      <div class="box c">C</div>
      <div class="box d">D</div>
    </div>
    <h2>Example 1: grid-template-areas</h2>

    <!-- Example 2: Using grid-column-start/end and grid-row-start/end -->
    <div class="wrapper wrapper2">
      <div class="box a">A</div>
      <div class="box b">B</div>
      <div class="box c">C</div>
      <div class="box d">D</div>
    </div>
    <h2>Example 2: grid-column-start/end & grid-row-start/end</h2>

    <!-- Example 3: Using grid-column and grid-row shorthand -->
    <div class="wrapper wrapper3">
      <div class="box a">A</div>
      <div class="box b">B</div>
      <div class="box c">C</div>
      <div class="box d">D</div>
    </div>
    <h2>Example 3: grid-column & grid-row shorthand</h2>

    <!-- Example 4: Using grid-area shorthand -->
    <div class="wrapper wrapper4">
      <div class="box a">A</div>
      <div class="box b">B</div>
      <div class="box c">C</div>
      <div class="box d">D</div>
    </div>
    <h2>Example 4: grid-area shorthand</h2>
  </body>
</html>
