<!DOCTYPE html>

<html>
  <head>
    <title>Flexbox</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box-1 {
        background: red;
        flex-grow: 1;
      }
      .box-2 {
        background: yellow;
      }
      .box-3 {
        background: green;
        flex-shrink: 1;
      }
      .box-4 {
        background: blue;
        flex-grow: 1;
      }
      .box-5 {
        background: purple;
      }
    </style>
  </head>
  <!-- COMMENT Hér! Bætti við max-width bara svo það strechar ekki yfir allan skjáin -->
  <body style="max-width: 500px">
    <div
      style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      "
    >
      <div style="display: flex; gap: 10px">
        <div class="box box-1">1</div>
        <div class="box box-2">2</div>
      </div>
      <div style="display: flex; gap: 10px">
        <div class="box box-3">3</div>
        <div class="box box-4">4</div>
        <div class="box box-5">5</div>
      </div>
    </div>
  </body>
</html>
